<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-body-dark text-light min-vh-100 d-flex flex-column justify-content-between">

    <div class="container py-4">
        <div class="d-flex justify-content-end align-items-center mb-4">  
            <button id="theme-toggle" class="btn btn-outline-lime rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;" title="Toggle Theme">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </div>
    
    <h1 class="header-login" style="padding: 10px">
        Welcome to
        <span class="text-secondary display-5">
            <strong>Gym</strong>
        </span>
        <span class="text-lime display-5">
            <strong>Bro</strong>
        </span>
        Website 💪🏻
    </h1>
    <main class="login-container">
        <div class="login-box">
            <h3 class="text-lime login-title">Login</h3>
            <p style="color: gray;">Welcome to the club!</p>
        <form id="loginForm">
        <div class="input-group-login" style="padding: 25px 10px;">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter Username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
            <a href="#" id="forgotLink" class="text-lime">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-lime w-100 shadow-sm mt-auto">Login</button>
        </form>
        <p class="register-text">
            Don't have an account ?
            <a href="register.html" class="text-lime">Register</a>
        </p>
        </div>
    </main>

<div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content gym-modal" id="forgotForm">
      <div class="modal-header">
        <div class="gym-modal-icon"><i class="bi bi-envelope"></i></div>
        <div>
          <h5 class="modal-title">Forgot Password</h5>
          <p class="gym-modal-sub">We'll send a reset link to your email</p>
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="gym-field">
          <label for="forgotEmail" class="gym-label">Email</label>
          <input type="email" class="form-control" id="forgotEmail" placeholder="name@example.com" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-lime">Send link</button>
      </div>
    </form>
  </div>
</div>


<div class="modal fade" id="resetModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content gym-modal" id="resetForm">
      <div class="modal-header">
        <div class="gym-modal-icon"><i class="bi bi-key"></i></div>
        <div>
          <h5 class="modal-title">Reset Password</h5>
          <p class="gym-modal-sub">Choose a new password</p>
        </div>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="gym-field">
          <label for="resetNewPassword" class="gym-label">New password</label>
          <input type="password" class="form-control" id="resetNewPassword" placeholder="At least 8 characters" minlength="8" required>
        </div>
        <div class="gym-field">
          <label for="resetConfirmPassword" class="gym-label">Confirm new password</label>
          <input type="password" class="form-control" id="resetConfirmPassword" placeholder="Re-enter new password" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-lime">Reset password</button>
      </div>
    </form>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/login.js"></script>
    <script src="./js/forgot.js"></script>
</body>
</html>
